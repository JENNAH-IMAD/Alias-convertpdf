name: alias-server
services:
  ocr:
    build:
      context: ..
      dockerfile: services/ocr/Dockerfile
    environment:
      WEB_CONCURRENCY: ${OCR_WORKERS:-2}
      OCR_CPU_THREADS: ${OCR_CPU_THREADS:-2}
      OCR_MODEL_SIZE: ${OCR_MODEL_SIZE:-small}
      OCR_PIPELINE: ${OCR_PIPELINE:-structure}
      OCR_LAYOUT_MODEL: ${OCR_LAYOUT_MODEL:-PP-DocLayout-M}
      OCR_DETECTION_MAX_SIDE: ${OCR_DETECTION_MAX_SIDE:-1280}
    volumes:
      - ocr-models:/root/.paddlex
    restart: unless-stopped
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: ${BACKEND_PORT:-5081}
      ConnectionStrings__Default: ${ALIAS_SQLSERVER:?Configurer la connexion SQL Server}
      Database__AutoMigrate: "true"
      Seed__DemoData: "false"
      Swagger__Enabled: "false"
      AllowedHosts: "*"
      Storage__Root: /app/uploads
      Ocr__BaseUrl: http://ocr:8091
      Ocr__MaxConcurrentJobs: ${OCR_CONCURRENT_JOBS:-2}
      Ocr__MaxQueuedJobs: ${OCR_QUEUED_JOBS:-32}
      Ocr__QueueWaitSeconds: "600"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-5081}:${BACKEND_PORT:-5081}"
    volumes:
      - documents:/app/uploads
    depends_on:
      - ocr
    restart: unless-stopped
  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_URL: /api
        API_PROXY_URL: http://backend:${BACKEND_PORT:-5081}
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${FRONTEND_PORT:-3002}:3000"
    depends_on:
      - backend
    restart: unless-stopped
volumes:
  documents:
  ocr-models:
